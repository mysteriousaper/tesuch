name: CI
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Fails on high/critical advisories in runtime dependencies only; dev tooling is not shipped.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    runs-on: ubuntu-24.04 # image ships PostgreSQL 16 binaries
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/tests/run.sh

  # End-to-end tests against the real Supabase project. Skipped (green) on forks and wherever the
  # repository secrets are not configured: secrets cannot be used in a job-level `if`, so a first step checks them.
  e2e:
    runs-on: ubuntu-24.04
    needs: app
    timeout-minutes: 30
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    env:
      HAS_SECRETS: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_ANON_KEY != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
    steps:
      - name: Check e2e secrets
        run: |
          if [ "$HAS_SECRETS" != "true" ]; then
            echo "::notice::e2e skipped: set SUPABASE_URL, SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY repository secrets to enable it."
          fi
      - if: env.HAS_SECRETS == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_SECRETS == 'true'
        uses: pnpm/action-setup@v4
        with: { version: 10 }
      - if: env.HAS_SECRETS == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - if: env.HAS_SECRETS == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.HAS_SECRETS == 'true'
        name: Install Playwright Chromium (version pinned by package.json)
        run: pnpm exec playwright install --with-deps chromium
      - if: env.HAS_SECRETS == 'true'
        name: Write .env.local
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          umask 077
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
            # Throwaway per-run values: the specs only check that wrong/missing secrets are rejected.
            echo "CRON_SECRET=$(openssl rand -hex 32)"
            echo "TELEGRAM_WEBHOOK_SECRET=$(openssl rand -hex 32)"
          } > .env.local
      - if: env.HAS_SECRETS == 'true'
        run: pnpm test:e2e # the script already passes --trace off (no traces with secrets in CI logs)
      - if: always() && env.HAS_SECRETS == 'true'
        name: Remove .env.local
        run: rm -f .env.local
